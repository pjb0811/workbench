name: Version

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Opens or updates the "Version Packages" PR from the accumulated
      # .changeset/*.md files. It never publishes; publish.yml does that once
      # the bumped version reaches main.
      - name: Open/update Version Packages PR
        uses: changesets/action@v2
        with:
          version-script: pnpm exec changeset version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
